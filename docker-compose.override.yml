# Applied automatically by `docker compose up` (dev). Both servers reload on file changes.
# For the production build instead:  docker compose -f docker-compose.yml up --build
services:
  api:
    command: ["uvicorn", "src.web:app", "--host", "0.0.0.0", "--port", "8100", "--reload"]
    volumes:
      - ./src:/app/src

  scheduler:
    volumes:
      - ./src:/app/src

  web:
    image: tsa-web-dev
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "[ -x node_modules/.bin/next ] || npm ci --no-audit --no-fund; exec npm run dev -- -H 0.0.0.0 -p 3000"]
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    environment:
      ARCHIVE_API: http://api:8100
      # Uncomment if edits on the host are not picked up (bind-mount file events can be flaky):
      # WATCHPACK_POLLING: "true"

volumes:
  web_node_modules:
  web_next:
