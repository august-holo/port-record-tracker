# Continuous replication of the chain-of-custody db to S3 (Litestream 0.5 config format:
# one `replica` per database). Credentials come from the EC2 instance role (IMDS); no keys here.
dbs:
  - path: /data/archive.db
    replica:
      type: s3
      bucket: ${BACKUP_BUCKET}
      path: litestream/archive.db
      region: ${AWS_REGION}
      sync-interval: 10s
