# Production overlay:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# Adds: caddy (TLS, the only public entry), litestream (continuous db replica to the
# backup bucket), raw-sync (hourly sync of raw bodies and capture manifests to the
# write-once evidence bucket). Containers use the instance role via IMDS (hop limit 2
# in infra/main.tf); no AWS keys on disk. Image tags are pinned; bump them on purpose.

services:
  api:
    ports: !override [] # only reachable via caddy

  web:
    ports: !override []

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      FQDN: ${FQDN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

  litestream:
    image: litestream/litestream:0.5.17
    command: replicate -config /etc/litestream.yml
    environment:
      BACKUP_BUCKET: ${BACKUP_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
      - ./data:/data
    restart: unless-stopped

  raw-sync:
    image: amazon/aws-cli:2.36.49
    entrypoint: ["/bin/sh", "-c"]
    # Raw bodies are content-addressed and immutable, so --size-only is safe and cheap for them.
    # Manifests (src/manifest.py) grow during their day, so they sync on size or mtime; the
    # bucket is versioned and locked, so every hourly state of a manifest is kept.
    command:
      - |
        until [ -d /data/raw ]; do sleep 30; done  # a new box has no captures for its first minute
        while true; do
          aws s3 sync /data/raw "s3://$${EVIDENCE_BUCKET}/raw" --size-only --no-progress
          if [ -d /data/manifests ]; then
            aws s3 sync /data/manifests "s3://$${EVIDENCE_BUCKET}/manifests" --exclude ".*" --no-progress
          fi
          sleep 3600
        done
    environment:
      EVIDENCE_BUCKET: ${EVIDENCE_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./data:/data:ro
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
